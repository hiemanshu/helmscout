# Deployed by .github/workflows/release.yml:
#
#   flyctl deploy --image ghcr.io/<owner>/helmscout:nightly --app <app>
#
# The image already contains the SPA, the API, the MCP endpoint and a read-only
# snapshot of the database, so there is no volume, no release download and no
# state to persist. Override the app name with --app or the FLY_APP variable.
app = "helmscout"
primary_region = "sin"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
