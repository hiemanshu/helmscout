name: Build & publish API image

# Builds the API + MCP container and pushes it to GHCR (free). Any host can then
# pull ghcr.io/<owner>/helmscout:latest — Fly, Render, Cloud Run, a VM, etc.
on:
  push:
    branches: [main]
    paths: ["lib/**", "config/**", "priv/**", "mix.exs", "mix.lock", "Dockerfile", "web/**"]
  workflow_dispatch:

jobs:
  image:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/helmscout:latest
            ghcr.io/${{ github.repository_owner }}/helmscout:${{ github.sha }}
